# Decap CMS 文章後台設定
backend:
  name: github
  repo: a7589531-coachgary/coachgary-site
  branch: main
  commit_messages:
    create: "新增文章：{{slug}}"
    update: "更新文章：{{slug}}"
    delete: "刪除文章：{{slug}}"
    uploadMedia: "上傳圖片：{{path}}"
    deleteMedia: "刪除圖片：{{path}}"

# 編輯流程模式：編輯頁有「儲存」按鈕，未完成的文章放在「工作流程」看板，按「發布」才會上線
publish_mode: editorial_workflow

locale: zh_Hant
site_url: https://jocular-tulumba-f558a8.netlify.app
display_url: https://jocular-tulumba-f558a8.netlify.app
logo_url: /assets/logo-180.png

# 上傳的圖片存放位置
media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{draft | ternary('【已下架】', '【已完成】')}} {{title}}（{{category}}）"
    sortable_fields: ["date", "title"]
    fields:
      - { label: 標題, name: title, widget: string }
      - { label: 發布日期, name: date, widget: datetime, date_format: "YYYY/MM/DD", time_format: false, format: "YYYY-MM-DD", picker_utc: true }
      # 分類選項來自「網站設定 → 文章分類」，可在後台自行新增
      - label: 分類（要新增分類，請到左側「網站設定 → 文章分類」）
        name: category
        widget: relation
        collection: settings
        file: categories
        search_fields: ["categories.*.name"]
        value_field: "categories.*.name"
        display_fields: ["categories.*.name"]
        options_length: 50
      - { label: 摘要（顯示在文章列表與分享預覽，約 50 字）, name: summary, widget: text, required: false }
      - { label: 封面圖（建議橫式 1200×630）, name: cover, widget: image, required: false }
      - { label: 從網站下架（已發布的文章想暫時隱藏時勾選）, name: draft, widget: boolean, default: false, required: false }
      - { label: 內文, name: body, widget: markdown }

  - name: settings
    label: 網站設定
    editor: { preview: false }
    files:
      - name: categories
        label: 文章分類
        file: content/settings/categories.json
        fields:
          - label: 分類清單（可新增、改名、拖曳排序）
            name: categories
            widget: list
            label_singular: 分類
            summary: "{{fields.name}}"
            fields:
              - { label: 分類名稱, name: name, widget: string }
              - label: 文章卡片底色
                name: color
                widget: select
                default: "#eef1f4"
                options:
                  - { label: 淺藍, value: "#e6f6fb" }
                  - { label: 藍紫, value: "#e8eefc" }
                  - { label: 淺綠, value: "#eaf5ee" }
                  - { label: 淺紫, value: "#f3ecfb" }
                  - { label: 淺橘, value: "#fdf0e6" }
                  - { label: 淺紅, value: "#fdeaec" }
                  - { label: 淺黃, value: "#fdf6dc" }
                  - { label: 淺灰, value: "#eef1f4" }
